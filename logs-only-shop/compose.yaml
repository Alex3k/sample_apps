name: ihub-logs-only-shop
x-otel-environment: &otel-environment
  OTEL_EXPORTER_OTLP_ENDPOINT:
  OTEL_EXPORTER_OTLP_HEADERS:
  OTEL_RESOURCE_ATTRIBUTES:
x-service: &service
  build: .
  init: true
  environment: &environment
    <<: *otel-environment
    DATABASE_URL: postgresql://shop:local-demo-only@db:5432/shop
  depends_on:
    db:
      condition: service_healthy
services:
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:3310:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on: [catalog, checkout]
  catalog:
    <<: *service
    environment:
      <<: *environment
      SERVICE: catalog
  checkout:
    <<: *service
    environment:
      <<: *environment
      SERVICE: checkout
      CATALOG_URL: http://catalog:8000
      PAYMENT_URL: http://payment:8000
  payment:
    <<: *service
    environment:
      <<: *otel-environment
      SERVICE: payment
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - shop-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  shop-data:
