server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    location /api/products { proxy_pass http://catalog:8000/products; }
    location /api/checkout { proxy_pass http://checkout:8000/checkout; }
    location / { try_files $uri $uri/ /index.html; }
}
